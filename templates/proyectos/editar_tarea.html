{% extends "base.html" %}

{% block title %}Editar tarea - {{ tarea.nombre }} {% endblock  %}

{% block content %}

    <h1>Editar tarea</h1>

    <p>Proyecto: {{ proyecto.nombre }}</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Guardar cambios</button>

        <a href="{% url 'detalle_proyecto' proyecto.id %}">Cancelar</a>

{% endblock  %}
